<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Daily Money Manager V2</title>
<style>
:root{--blue:#2459e8;--purple:#6541e8;--green:#19ad57;--red:#e43b45;--text:#161922;--muted:#737985;--card:#fff;--bg:#f7f8fb;--shadow:0 8px 24px rgba(25,35,60,.10);--radius:20px}
*{box-sizing:border-box}html,body{margin:0;background:#edf0f6;color:var(--text);font-family:Inter,Arial,sans-serif}
body{min-height:100vh}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 35px rgba(0,0,0,.10);padding:14px 14px 92px}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{display:flex;align-items:center;gap:13px;padding:7px 2px 15px}.menu,.bell{border:0;background:none;font-size:25px}.greet{flex:1}.greet b{display:block;font-size:18px}.greet span{font-size:12px;color:var(--muted);display:block;margin-top:4px}.bell{position:relative}.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#ef3340;right:2px;top:2px}
.balance{color:#fff;border-radius:22px;padding:18px 18px 17px;background:linear-gradient(135deg,#7045e8 0%,#235ee6 100%);box-shadow:0 12px 26px rgba(49,84,225,.28)}.bhead,.bfoot{display:flex;align-items:center;justify-content:space-between}.bhead{font-size:13px}.eye{border:0;background:none;color:#fff;font-size:18px}.bvalue{font-size:30px;font-weight:850;margin:10px 0 11px}.growth{background:rgba(17,72,188,.62);border-radius:15px;padding:6px 10px;font-size:12px}
.accounts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.account{position:relative;overflow:hidden;border-radius:18px;padding:17px;background:#f2fff7;box-shadow:var(--shadow)}.account.online{background:#f5f8ff}.account span{font-size:15px}.account strong{display:block;font-size:17px;margin:7px 0}.account small{font-weight:700;color:#17a35a}.online small{color:#2c60d9}.wave{position:absolute;right:7px;bottom:4px;font-size:34px;color:#1db86b;transform:rotate(-9deg)}.online .wave{color:#386be1}
h3{font-size:15px;margin:16px 3px 10px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sum{border:1px solid #edf0f5;border-radius:16px;text-align:center;padding:11px 5px;box-shadow:0 4px 14px rgba(0,0,0,.06)}.sum label{display:block;font-size:11px;color:#218a4b}.sum.exp label{color:#d9343d}.sum.net label{color:#2b60d5}.circle{width:38px;height:38px;border-radius:50%;margin:7px auto;color:#fff;display:grid;place-items:center;font-size:23px;background:var(--green)}.exp .circle{background:var(--red)}.net .circle{background:var(--blue)}.sum strong{font-size:12px}
.section-title{display:flex;align-items:center;justify-content:space-between}.section-title h3{margin-bottom:8px}.view{border:0;background:none;color:#1e50bb;font-size:12px}
.txlist{border:1px solid #f0f1f4;border-radius:15px;overflow:hidden}.tx{display:flex;align-items:center;padding:11px 9px;border-bottom:1px solid #f0f1f4}.tx:last-child{border-bottom:0}.txicon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;margin-right:10px;font-size:22px}.txicon.in{background:#e4f9ec;color:#149149}.txicon.out{background:#ffe7e9;color:#dd3038}.txicon.tr{background:#e8efff;color:#2b5ed8}.txmain{flex:1;min-width:0}.txmain b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txmain small{display:block;color:#7b818d;font-size:10px;margin-top:3px}.amt{font-size:12px;font-weight:800}.amt.in{color:#148844}.amt.out{color:#dc3038}.amt.tr{color:#285edb}.empty{text-align:center;color:#9298a4;padding:25px 10px;font-size:12px}
.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:72px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid #edf0f4;display:flex;align-items:center;justify-content:space-around}.nav button{border:0;background:none;color:#777d89;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav button span{font-size:10px}.nav .active{color:#2459df}.fab{width:58px!important;height:58px;border-radius:50%!important;background:#2a5fe0!important;color:#fff!important;font-size:38px!important;line-height:58px;box-shadow:0 9px 20px rgba(38,91,222,.35);margin-top:-24px}
.overlay{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}.hidden{display:none}.sheet{width:min(430px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:25px 25px 0 0;padding:18px}.sheet h2{font-size:18px;text-align:center;margin:0 0 15px}.close{float:right;border:0;background:#f0f2f5;border-radius:50%;width:30px;height:30px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.action{border:0;background:#f7f8fb;border-radius:16px;padding:15px 7px;font-weight:700}.action i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:#fff;font-style:normal;font-size:26px;margin:0 auto 8px}.action.in i{background:var(--green)}.action.out i{background:var(--red)}.action.tr i{background:var(--blue)}.field{margin:11px 0}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #e1e4eb;border-radius:12px;padding:12px;outline:none;background:#fff}.field textarea{min-height:65px;resize:vertical}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modes button{padding:11px;border:1px solid #ddd;border-radius:11px;background:#fff}.modes button.sel{background:var(--green);color:#fff;border-color:var(--green)}.expense .modes button.sel{background:var(--red);border-color:var(--red)}.save{width:100%;border:0;border-radius:12px;padding:14px;color:#fff;font-weight:800;background:var(--green)}.save.expense{background:var(--red)}.save.transfer{background:var(--blue)}
.page-title{font-size:20px;font-weight:800;margin:8px 0 14px}.reportbox{border-radius:16px;background:#f7f9ff;padding:15px;margin:10px 0}.reportbox b{font-size:14px}.reportbox p{font-size:13px;margin:9px 0}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.filters button{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:16px;padding:7px 12px;font-size:11px}.filters .sel{background:var(--blue);color:#fff;border-color:var(--blue)}.morebtn{padding:10px 13px;border:1px solid #dce1eb;border-radius:10px;background:#fff;margin-right:5px}
</style>
</head>
<body>
<div class="app">
<header class="top"><button class="menu">☰</button><div class="greet"><b>Hi, Moniur 👋</b><span>Good Morning</span></div><button class="bell">♧<i class="dot"></i></button></header>
<section class="balance"><div class="bhead"><span>Total Balance</span><button class="eye" id="eye">◉</button></div><div class="bvalue" id="total">₹ 0.00</div><div class="bfoot"><span>All Accounts⌄</span><span class="growth">↗ 0.0%</span></div></section>
<section class="accounts"><div class="account"><span>Cash</span><strong id="cash">₹ 0.00</strong><small>↗ 0.0%</small><div class="wave">⌁╱</div></div><div class="account online"><span>Online</span><strong id="online">₹ 0.00</strong><small>↗ 0.0%</small><div class="wave">⌁╱</div></div></section>
<h3>Today's Summary</h3><section class="summary"><div class="sum"><label>Income</label><div class="circle">↑</div><strong id="income">₹ 0.00</strong></div><div class="sum exp"><label>Expense</label><div class="circle">↓</div><strong id="expense">₹ 0.00</strong></div><div class="sum net"><label>Net</label><div class="circle">↗</div><strong id="net">₹ 0.00</strong></div></section>
<div class="section-title"><h3>Recent Transactions</h3><button class="view" id="all">View all</button></div><section class="txlist" id="list"></section>
</div>
<nav class="nav"><button class="active" onclick="home()">⌂<span>Home</span></button><button onclick="historyPage()">◷<span>History</span></button><button class="fab" onclick="chooser()">+</button><button onclick="reports()">▥<span>Reports</span></button><button onclick="more()">•••<span>More</span></button></nav>
<div class="overlay hidden" id="overlay"><div class="sheet" id="sheet"></div></div>
<script>
const K="mobile_money_final_v2";let s=JSON.parse(localStorage.getItem(K)||'{"cash":0,"online":0,"hidden":false,"tx":[]}');
const $=x=>document.querySelector(x), money=n=>"₹ "+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(K,JSON.stringify(s));render()}function closeSheet(){$("#overlay").classList.add("hidden")}function openSheet(x){$("#sheet").innerHTML=x;$("#overlay").classList.remove("hidden")}
function render(){let i=0,e=0;s.tx.forEach(t=>{if(t.date===today()){if(t.type==="in")i+=t.amount;if(t.type==="out")e+=t.amount}});let total=s.cash+s.online;$("#total").textContent=s.hidden?"₹ ••••••":money(total);$("#cash").textContent=s.hidden?"₹ ••••••":money(s.cash);$("#online").textContent=s.hidden?"₹ ••••••":money(s.online);$("#income").textContent=money(i);$("#expense").textContent=money(e);$("#net").textContent=money(i-e);let a=s.tx.slice(0,6),l=$("#list");l.innerHTML=a.length?a.map(t=>`<div class="tx"><div class="txicon ${t.type}">${t.type==="in"?"↑":t.type==="out"?"↓":"⇄"}</div><div class="txmain"><b>${esc(t.title)}</b><small>${esc(t.mode||"")} · ${t.time||""}</small></div><div class="amt ${t.type}">${t.type==="in"?"+":t.type==="out"?"-":"⇄"} ${money(t.amount)}</div></div>`).join(""):'<div class="empty">No transactions yet.<br>Tap + to add Income, Expense or Transfer.</div>'}
function esc(x){return String(x||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
$("#eye").onclick=()=>{s.hidden=!s.hidden;save()};$("#overlay").onclick=e=>{if(e.target.id==="overlay")closeSheet()};$("#all").onclick=historyPage;
function chooser(){openSheet(`<button class="close" onclick="closeSheet()">×</button><h2>Add Transaction</h2><div class="actions"><button class="action in" onclick="form('in')"><i>↑</i>Income</button><button class="action out" onclick="form('out')"><i>↓</i>Expense</button><button class="action tr" onclick="transfer()"><i>⇄</i>Transfer</button></div>`)}
let mode="Cash";
function form(type){mode="Cash";openSheet(`<button class="close" onclick="closeSheet()">×</button><h2>${type==="in"?"Add Income":"Add Expense"}</h2><div class="field"><label>Amount</label><input id="amt" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>Party (Optional)</label><input id="party" placeholder="Select Party"></div><div class="field"><label>Category / Head</label><input id="cat" placeholder="Select Category"></div><div class="field"><label>Mode</label><div class="modes"><button id="cashM" class="sel" onclick="pick('Cash')">Cash</button><button id="onlineM" onclick="pick('Online')">Online</button></div></div><div class="field"><label>Note (Optional)</label><textarea id="note" placeholder="Add note here..."></textarea></div><button class="save ${type==="out"?"expense":""}" onclick="submit('${type}')">Save ${type==="in"?"Income":"Expense"}</button>`)}
function pick(x){mode=x;$("#cashM").classList.toggle("sel",x==="Cash");$("#onlineM").classList.toggle("sel",x==="Online")}
function submit(type){let a=+$("#amt").value;if(!a||a<0)return alert("Please enter an amount.");let k=mode.toLowerCase();if(type==="out"&&s[k]<a)return alert("Insufficient "+mode+" balance.");s[k]+=type==="in"?a:-a;s.tx.unshift({type,amount:a,mode,date:today(),time:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}),title:$("#party").value||$("#cat").value||(type==="in"?"Income":"Expense"),note:$("#note").value});save();closeSheet()}
function transfer(){openSheet(`<button class="close" onclick="closeSheet()">×</button><h2>Add Transfer</h2><div class="field"><label>Amount</label><input id="tamt" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>From</label><select id="from"><option>Cash</option><option>Online</option></select></div><div class="field"><label>To</label><select id="to"><option>Online</option><option>Cash</option></select></div><div class="field"><label>Note (Optional)</label><textarea id="tnote" placeholder="Add note here..."></textarea></div><button class="save transfer" onclick="submitTransfer()">Transfer Now</button>`)}
function submitTransfer(){let a=+$("#tamt").value,f=$("#from").value,t=$("#to").value;if(!a||a<0)return alert("Please enter an amount.");if(f===t)return alert("From and To must be different.");if(s[f.toLowerCase()]<a)return alert("Insufficient "+f+" balance.");s[f.toLowerCase()]-=a;s[t.toLowerCase()]+=a;s.tx.unshift({type:"tr",amount:a,mode:f+" → "+t,date:today(),time:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}),title:"Transfer to "+t,note:$("#tnote").value});save();closeSheet()}
function historyPage(){openSheet(`<button class="close" onclick="closeSheet()">×</button><div class="page-title">History</div>${s.tx.length?s.tx.map(t=>`<div class="tx"><div class="txicon ${t.type}">${t.type==="in"?"↑":t.type==="out"?"↓":"⇄"}</div><div class="txmain"><b>${esc(t.title)}</b><small>${t.date} · ${esc(t.mode||"")}</small></div><div class="amt ${t.type}">${t.type==="in"?"+":t.type==="out"?"-":"⇄"} ${money(t.amount)}</div></div>`).join(""):'<div class="empty">No transactions yet.</div>'}`)}
function reports(){let i=0,e=0;s.tx.forEach(t=>t.type==="in"?i+=t.amount:t.type==="out"?e+=t.amount:0);openSheet(`<button class="close" onclick="closeSheet()">×</button><div class="page-title">Reports</div><div class="filters"><button class="sel">Today</button><button>Week</button><button>Month</button><button>Year</button><button>Custom</button></div><div class="reportbox"><b>Monthly Summary</b><p>Income: ${money(i)}</p><p>Expense: ${money(e)}</p><p>Net: ${money(i-e)}</p></div><div class="reportbox"><b>Cash / Online Summary</b><p>Cash: ${money(s.cash)}</p><p>Online: ${money(s.online)}</p></div>`)}
function more(){openSheet(`<button class="close" onclick="closeSheet()">×</button><div class="page-title">More</div><div class="reportbox"><b>Backup & Restore</b><p>Your data stays on this device.</p><button class="morebtn" onclick="backup()">Backup</button><button class="morebtn" onclick="restore()">Restore</button></div><div class="reportbox"><b>Export</b><p><button class="morebtn" onclick="csv()">Export CSV</button></p></div><div class="reportbox"><b>Reset App</b><p><button class="morebtn" onclick="resetApp()">Reset all data</button></p></div>`)}
function home(){closeSheet();render()}function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:"application/json"}));a.download="money-app-backup.json";a.click()}function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{s=JSON.parse(r.result);save();closeSheet()}catch(e){alert("Invalid backup")}};r.readAsText(i.files[0])};i.click()}function csv(){let rows=[["Date","Time","Type","Title","Mode","Amount"],...s.tx.map(t=>[t.date,t.time,t.type,t.title,t.mode,t.amount])];let c=rows.map(r=>r.map(x=>`"${String(x??"").replaceAll('"','""')}"`).join(",")).join("\\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="transactions.csv";a.click()}function resetApp(){if(confirm("Reset all app data?")){s={cash:0,online:0,hidden:false,tx:[]};save();closeSheet()}}
render();
</script>
</body>
</html>
